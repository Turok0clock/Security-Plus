<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101726"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FAR Academy"><link rel="manifest" href="manifest.webmanifest"><title>Federal Contractor Academy</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b101b;color:#ebf2ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px 15px 90px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:29px;margin:8px 0}h2{font-size:22px;margin:6px 0 15px}h3{font-size:17px;margin:4px 0}p{line-height:1.6}small,.muted{color:#acb9d1}nav{display:flex;gap:8px;overflow-x:auto;margin:20px 0}button{background:#1a2a47;color:#f4f8ff;border:1px solid #354869;border-radius:11px;padding:11px 14px;font:inherit;cursor:pointer}button:disabled{opacity:.5}.primary,.active{background:#4277df}main{display:grid;gap:16px}.hero,.card{background:#131d30;border:1px solid #2a3954;border-radius:17px;padding:20px}.hero{background:linear-gradient(120deg,#192e55,#111a2b)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{display:grid;gap:11px}.bar{height:11px;background:#263551;border-radius:20px;overflow:hidden}.bar>i{display:block;height:100%;background:#61a1ff}.tag{font-size:12px;color:#9bc2ff}textarea,input{width:100%;font:inherit;color:white;background:#0d1525;border:1px solid #3c506f;border-radius:10px;padding:12px}textarea{min-height:100px}.answers{display:grid;gap:9px}.answers button{text-align:left}.selected{border-color:#90c5ff;background:#29466e}.correct{border-color:#40ce9e!important}.incorrect{border-color:#ff879a!important}.notice{padding:12px 15px;border-left:3px solid #6cafff;background:#1b3051;border-radius:7px}.actions{display:flex;gap:10px;flex-wrap:wrap}a{color:#a5c7ff}footer{font-size:12px;color:#aeb8c8;margin-top:30px}label{display:block;margin:10px 0}.back{align-self:start}</style></head><body><div class="wrap"><header><div><strong>▣ FEDERAL CONTRACTOR ACADEMY</strong><div class="muted">FAR literacy • PACS / IDS / CCTV</div></div><small>OFFLINE PWA</small></header><nav><button data-nav="home">Dashboard</button><button data-nav="lessons">Lessons</button><button data-nav="terms">Glossary</button><button data-nav="tools">Field Kit</button></nav><main id="view"></main><footer>Independent educational material. Not NCMA content, certification training or legal advice. Verify current contract terms, FAR and agency supplements.</footer></div><script>const L=[["Acquisition Basics","FAR 1, 2, 5, 7, 10","Government need → acquisition planning → market research → solicitation → evaluation → award → administration → closeout. FAR governs government purchasing; your contract determines the specific obligations you accepted.","A federal site wants 25 new card readers. A sources-sought notice tests industry capability before the solicitation.","Who may change the contract?",["The warranted contracting officer within delegated authority","Any COR","Any site manager"],0],["Reading Solicitations","FAR 11, 15, 52","Read the SOW/PWS, drawings, CLINs, clauses, labor categories, clearances, delivery schedule and acceptance requirements together. Build a compliance matrix.","A drawing shows 20 cameras but the equipment schedule shows 22. Log the conflict and seek a formal clarification before pricing.","What is your first action?",["Use the authorized solicitation Q&A process","Quietly quote 20 cameras","Ignore the conflicting document"],0],["Contract Types","FAR 16","Firm-fixed-price (FFP) shifts much cost-overrun risk to the contractor. Time-and-materials (T&M) uses priced labor time plus materials under contract rules. IDIQ contracts are vehicles for orders.","An FFP PACS job uses 40 more labor hours than planned. Determine whether it was estimating error or an authorized change.","Can a PM automatically bill extra FFP hours?",["No, review scope and contract entitlement first","Yes, all actual hours are reimbursable","Yes, when the client is federal"],0],["Authority & Direction","FAR 1.602, 1.604, 43","A CO binds the government only within delegated authority. A COR performs duties specified in writing and cannot independently change scope, price or terms.","A COR asks for four extra readers during commissioning and says paperwork can follow.","Best first response?",["Check awarded scope and route change for proper authority","Install immediately and invoice later","Ask technicians to decide"],0],["Scope & Modifications","FAR 43","Compare proposed work to award baseline and relevant changes clauses. Document impacts to price, labor, schedule and equipment. Track approval and notices.","Four new doors need readers, cable, license capacity and programming.","First PM step?",["Check baseline and document requested change","Order parts without documenting","Assume no impact because work is small"],0],["Schedules & Delays","FAR 11, 43; contract clauses","Know the period of performance, critical-path dependencies, NTP and notice requirements. Maintain dated records of delays, mitigation and resources.","Government escort staff cannot admit your technicians for three days.","Best action?",["Document access problems and follow notice procedure","Assume three days are automatically payable","Delete the schedule baseline"],0],["RFIs & Submittals","SOW; FAR 4, 11","Maintain RFIs, product submittals, design revisions, testing records, daily reports and as-built drawings. Product approval is not necessarily a contract modification.","Supplier proposes a replacement IP intercom because the approved model is delayed.","Best response?",["Submit substitution through the specified approval process","Install the alternative without notice","Treat vendor statement as government approval"],0],["Subcontract Management","FAR 44; subcontract","Government–prime and prime–sub are separate contractual relationships. Track flow-downs, direction, insurance, clearances, work acceptance and changes.","Government requests added cameras directly from your subcontract team.","Who should authorize the added subcontract work?",["Appropriate authority through both contract relationships","Any government visitor","A technician on site"],0],["Labor & Compliance","FAR 22; clauses","Check wage determinations, relevant labor categories, certifications, clearance requirements, site access and safety provisions. Requirements differ by award.","A technician has Security+ but lacks the required site clearance.","Can a PM assign the technician anyway?",["No, verify contract and site access requirements","Yes, Security+ replaces all clearances","Yes, if supervised"],0],["Invoicing & Margin","FAR 31, 32; payment terms","Bill according to CLINs, milestones and accepted deliverables. Track estimated at completion, cost burn, unbilled changes and cash flow.","A $100,000 FFP project forecasts $76,000 total direct costs before overhead.","What is the initial gross difference?",["$24,000 before other costs","$76,000 profit","$100,000 cash available"],0],["Quality & Acceptance","FAR 46; contract","Test against acceptance requirements, record deficiencies and punch lists, deliver customer training and verify acceptance authority.","Every camera streams locally, but two are not visible at the contracted control center.","Best decision?",["Fix and document unmet acceptance criteria","Declare final acceptance","Ignore central monitoring"],0],["Stop Work & Disputes","FAR 33, 49; applicable clauses","Distinguish a formal CO stop-work order from informal interruption. Protect safety, preserve records, notify management and follow contract procedures.","A building manager halts work and says they will contact contracting later.","What should the PM do first?",["Make site safe, document and promptly escalate","Ignore safety instructions","Assume verbal instruction is always a formal FAR stop-work order"],0],["Closeout","FAR 4, 42, 46; contract","Finish punch lists, as-builts, licenses, commissioning results, manuals, training, property tracking, invoicing and warranty transition.","The access control system runs, but the contract-required manuals and training remain unfinished.","Is closeout finished?",["No, track remaining contractual deliverables","Yes, devices are online","Yes, after the last technician leaves"],0],["Capture & Proposals","FAR 5, 6, 9, 10, 15, 19","Sources sought, RFIs, NAICS, set-asides, past performance and staffing credentials influence bids. Base every capability assertion on real evidence.","An RFI seeks cleared PACS personnel and nationwide deployment experience.","Best response?",["Provide verifiable personnel and performance capabilities","Invent qualifications","Treat market research as a guaranteed award"],0]],G=[["FAR","Federal Acquisition Regulation"],["CO","Contracting Officer"],["COR","Contracting Officer's Representative"],["SOW","Statement of Work"],["PWS","Performance Work Statement"],["CLIN","Contract Line Item Number"],["FFP","Firm-Fixed-Price"],["T&M","Time-and-Materials"],["IDIQ","Indefinite-Delivery / Indefinite-Quantity"],["RFI","Request for Information"],["RFP","Request for Proposal"],["RFQ","Request for Quotation"],["NTP","Notice to Proceed"],["CPARS","Contractor Performance Assessment Reporting System"],["NAICS","North American Industry Classification System"]];let S;try{S=JSON.parse(localStorage.getItem("faracademy2")||"{}")}catch(e){S={}}S.done??={};S.notes??={};S.scores??={};let page="home",id=0,chosen=-1,graded=false;const V=document.getElementById("view"),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function save(){localStorage.setItem("faracademy2",JSON.stringify(S))}function b(label,fn,cl=""){let x=document.createElement("button");x.textContent=label;x.className=cl;x.onclick=fn;return x}function nav(p){page=p;document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav===p));render();window.scrollTo(0,0)}document.querySelectorAll("[data-nav]").forEach(x=>x.onclick=()=>nav(x.dataset.nav));function open(i){id=i;chosen=-1;graded=false;nav("detail")}function render(){let n=Object.keys(S.done).filter(k=>S.done[k]).length;if(page==="home"){V.innerHTML='<section class="hero"><small>14-CHAPTER INTERACTIVE BOOK</small><h1>Make the jump from field technician to federal contractor PM.</h1><p>Short explanations, real-world physical-security scenarios, quick decision checks, notes, vocabulary, and risk-management tools.</p><div class="bar"><i style="width:'+(100*n/L.length)+'%"></i></div><p>'+n+' / '+L.length+' chapters complete</p><div id="resume"></div></section><section class="card"><h2>Think like an operations leader</h2><div class="notice">Operational need ≠ contractual authority. First verify the work is in scope, then confirm authorized direction.</div></section>';$("#resume").append(b("Continue reading →",()=>open(Math.max(0,L.findIndex((_,i)=>!S.done[i]))),"primary"));return}if(page==="lessons"){V.innerHTML='<h2>Table of contents</h2><section class="grid">'+L.map((x,i)=>'<article class="card"><small class="tag">CHAPTER '+(i+1)+' · '+esc(x[1])+'</small><h3>'+esc(x[0])+'</h3><p>'+esc(x[2]).slice(0,110)+'…</p><span>'+((S.done[i])?"✓ Completed":"○ Not finished")+'</span><button data-open="'+i+'">Read chapter →</button></article>').join("")+'</section>';document.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>open(+x.dataset.open));return}if(page==="detail"){const x=L[id];V.innerHTML='<div class="actions"><button id="back">← Contents</button><small>Chapter '+(id+1)+' of '+L.length+'</small></div><section class="hero"><small>'+esc(x[1])+'</small><h1>'+esc(x[0])+'</h1></section><section class="card"><h2>Learn</h2><p>'+esc(x[2])+'</p><p><a href="https://www.acquisition.gov/browse/index/far" target="_blank" rel="noopener">Official FAR reference ↗</a></p></section><section class="card" id="textbook"><h2>Expanded textbook reading</h2><div id="textbook-body">Loading…</div></section><section class="card"><h2>Field example</h2><div class="notice">'+esc(x[3])+'</div></section><section class="card"><h2>PM decision check</h2><p>'+esc(x[4])+'</p><div class="answers" id="answers"></div><div id="feedback"></div><div id="check"></div></section><section class="card"><h2>Your field notes</h2><p class="muted">Explain who has authority, what is documented, and what could affect margin or schedule.</p><textarea id="note" placeholder="Write your response...">'+esc(S.notes[id]||"")+'</textarea></section><section class="card"><h2>Checkpoint</h2><div id="complete"></div></section><div class="actions" id="next"></div>';if(id===0){fetch("./textbook-module-01.json").then(r=>r.json()).then(d=>{$("#textbook-body").innerHTML=d.chapters[0].sections.map(s=>'<h3>'+esc(s.heading)+'</h3><p>'+esc(s.body)+'</p>').join("")}).catch(()=>{$("#textbook-body").textContent="Connect to load the lesson."})}else{$("#textbook").remove()}$("#back").onclick=()=>nav("lessons");$("#note").oninput=e=>{S.notes[id]=e.target.value;save()};function answers(){let el=$("#answers");el.replaceChildren();x[5].forEach((a,i)=>{let q=b("ABC"[i]+". "+a,()=>{if(!graded){chosen=i;answers()}});if(chosen===i)q.classList.add("selected");if(graded&&i===x[6])q.classList.add("correct");if(graded&&chosen===i&&i!==x[6])q.classList.add("incorrect");el.append(q)})}function check(){let el=$("#check");el.replaceChildren();el.append(b("Grade answer",()=>{if(chosen<0)return;graded=true;S.scores[id]=chosen===x[6];save();answers();check();$("#feedback").innerHTML='<p class="notice">'+(S.scores[id]?"Correct. ":"Review the decision. ")+'Preferred answer: '+esc(x[5][x[6]])+'. Focus on scope, authority, documentation and financial exposure.</p>'},"primary"));el.lastChild.disabled=graded;el.append(b("Try again",()=>{graded=false;chosen=-1;answers();check();$("#feedback").textContent=""}))}answers();check();$("#complete").append(b(S.done[id]?"✓ Complete (tap to unmark)":"Mark complete",()=>{S.done[id]=!S.done[id];save();render()},"primary"));if(id<L.length-1)$("#next").append(b("Next chapter →",()=>open(id+1)));return}if(page==="terms"){V.innerHTML='<h2>FAR vocabulary</h2><input id="search" placeholder="Find a term"><section class="grid" id="entries"></section>';let draw=()=>$("#entries").innerHTML=G.filter(t=>t.join(" ").toLowerCase().includes($("#search").value.toLowerCase())).map(t=>'<article class="card"><h3>'+esc(t[0])+'</h3>'+esc(t[1])+'</article>').join("");$("#search").oninput=draw;draw();return}if(page==="tools"){V.innerHTML='<h2>Contractor PM Field Kit</h2><section class="card"><h3>Before accepting changed work</h3>'+["Compare to awarded scope and current modification baseline","Record requester and verify delegated authority","Quantify equipment, labor, schedule and integration effects","Review required notice/change procedure","Obtain proper authorization when required","Preserve drawings, correspondence and daily logs"].map(x=>'<label><input style="width:auto" type="checkbox"> '+x+'</label>').join("")+'</section><section class="card"><h3>Estimate added direct costs</h3><label>Hardware ($)<input type="number" id="hard" value="8000"></label><label>Labor ($)<input type="number" id="labor" value="4500"></label><label>Programming ($)<input type="number" id="program" value="1500"></label><label>Travel/other ($)<input type="number" id="other" value="1000"></label><h2 id="cost"></h2><small>Example costs only, not a contract price or entitlement.</small></section><section class="card"><h3>Progress backup</h3><div class="actions"><button id="export">Export progress</button><input type="file" id="import" accept="application/json"></div></section>';let calc=()=>$("#cost").textContent="Estimated cost impact: $"+["hard","labor","program","other"].reduce((a,k)=>a+(Number($("#"+k).value)||0),0).toLocaleString();["hard","labor","program","other"].forEach(k=>$("#"+k).oninput=calc);calc();$("#export").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.href=u;a.download="far-academy-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$("#import").onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(confirm("Replace this device's progress?")){S=j;S.done??={};S.notes??={};S.scores??={};save();render()}}catch(e){alert("Invalid progress file")}}}}nav("home");if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>

<script>
const STAGES=[["Define the need","An agency identifies an operational problem before deciding what to buy.","A facility cannot consistently control and audit access at 24 doors. The need is reliable access management; replacing every reader is only one possible solution.","Program / security team","Describe the operational gap, affected users and desired outcome.","Contracting team","Help shape a buyable requirement and identify planning constraints.","Prime / subcontractor","Offer accurate technical knowledge through appropriate exchanges; avoid assuming a purchase is guaranteed.","Need statement","The facility needs reliable credential-based access and auditable events at 24 openings. Existing operations must remain available during transition. Site conditions and compatibility require investigation.","Explain why an operational need is different from a shopping list.","A manager asks for 24 new readers because badge entry is unreliable. What would you establish before treating replacement as the requirement?","Separate the observed problem from a proposed solution. Establish affected doors, failure patterns, operational/security outcomes and constraints. Reader replacement may not address credential configuration, networking or controller problems.",[0,1,13]],["Research the market","The agency investigates capabilities, solutions, delivery and possible costs. Requirements and planning can evolve together.","A planning notice asks about compatible readers, installation capacity and typical costs. Your firm supplies evidence and assumptions rather than inventing a binding offer.","Program / security team","Test technical feasibility and refine the requirement.","Contracting team","Collect market information and consider available suppliers and acquisition approaches.","Prime / subcontractor","Respond to requested capability and cost questions; explore relevant teaming opportunities.","Request for Information (RFI)","TRAINING NOTICE: Information requested for planning only. Responses are not offers. Describe occupied-facility installation experience, staffing availability, equipment compatibility, lead times and typical installation costs. State assumptions. No award will result from this RFI.","Why can an RFI ask about costs without asking for a binding offer?","A planning-only notice asks for typical cost per opening. Your boss says an RFI means we should send qualifications but no prices. What would you advise?","Follow the actual request. Provide useful planning-level cost information with assumptions and qualifications, alongside capabilities. Avoid a full proposal unless requested. Pricing questions alone do not make this an award solicitation.",[0,13]],["Plan the acquisition","The agency develops how to obtain and fund the requirement, including contract approach, schedule and evaluation strategy. This overlaps market research.","The team considers a phased installation and measurable acceptance tests to reduce disruption.","Program / security team","Define performance, constraints, estimated resources and acceptance needs.","Contracting team","Develop the acquisition approach with relevant funding and technical personnel.","Prime / subcontractor","Assess likely fit, delivery constraints and potential partnerships.","Acquisition planning brief","TRAINING BRIEF: Compare phased replacement with a single outage. Define interfaces, occupied-site access, funding coordination, delivery schedule and acceptance responsibilities. Select an appropriate procurement method and contract structure.","Explain the difference between deciding what is needed and deciding how to buy it.","The agency knows the desired outcome but is unsure whether industry can meet a proposed 30-day schedule. What would help before finalizing the solicitation?","Use market information and technical input to test lead times, access limits, integration and staffing assumptions. Planning can revisit requirements; it is not a one-way sequence with no feedback.",[0,2,8,13]],["Solicit the work","The solicitation tells vendors what to provide, how to respond and how the response will be evaluated. An RFP, IFB or RFQ represents a different route, not three mandatory successive steps.","Read scope, drawings, line items, instructions and evaluation criteria together before estimating.","Program / security team","Support technical requirements, site information and questions.","Contracting team","Issue the solicitation and manage official amendments and exchanges.","Prime / subcontractor","Build a compliance matrix, clarify conflicts and prepare the requested submission.","Request for Proposal (RFP) excerpt","TRAINING RFP: Provide a technical approach, schedule, relevant experience and fixed-price schedule for the stated scope. Address occupied-site access and integration. Evaluation considers the stated technical and price factors. Submit questions through the identified channel. This excerpt omits actual submission dates and full terms.","What three questions should you answer when first reading a solicitation?","Drawings show 24 openings; the equipment schedule lists 26. The response is due soon. How would you handle the discrepancy before committing to a price?","Record the exact conflicting references and use the solicitation's question process. Track formal answers and amendments, then reconcile scope and pricing. Do not silently choose the cheaper quantity or assume an unsupported exclusion is acceptable.",[1,2,13]],["Evaluate and award","The government evaluates according to the solicitation and makes the award. The chosen procurement method controls whether discussions occur.","A technical narrative explains how the company will execute the requirement; the price schedule states what it offers to charge.","Program / security team","Provide assigned technical evaluation support.","Contracting team","Conduct the applicable evaluation and award process.","Prime / subcontractor","Supply a compliant response and handle permitted exchanges; finalize relevant subcontract arrangements.","Contractor proposal excerpt","TRAINING RESPONSE: Sequence work in approved access windows. Verify interfaces, stage equipment, install and configure by area, test each opening, train operators and deliver as-builts. Pricing example: installation $24,000; integration/testing $8,000; training/documentation $3,000. Total $35,000. Fictional illustration, not a market estimate or complete offer.","Why does a technically appealing proposal still need to follow submission and evaluation instructions?","A team writes a strong technical narrative but omits the required pricing schedule. What risk does that create, and how would you prevent it?","The response may fail solicitation requirements or prevent proper evaluation. Use a compliance matrix linking each instruction to a response location and perform a submission check. Do not assume the government will permit a correction.",[1,13]],["Perform and administer","The parties execute and administer the awarded contract. Scope, authority, records, payment and schedule matter throughout performance.","A field request for extra doors must be compared with awarded scope and routed through the applicable contract relationship.","Program / security team","Coordinate technical needs and delegated oversight.","Contracting team","Exercise contractual authority and administer authorized changes.","Prime / subcontractor","Execute work, report progress, control costs and follow contractual notice/change procedures.","Change-impact record","TRAINING RECORD: Request: four additional controlled openings. Baseline references: awarded scope and drawings. Impacts to investigate: hardware, cable routes, licenses, programming, access windows, labor, testing and completion date. Record requester and required authorization. This record itself does not authorize changed work.","Why is a technical request different from authorization to change contracted work?","A site representative asks your subcontract crew to add four doors and promises approval later. Explain your next steps without treating the promise as an approved change.","Check scope, record the request and potential impacts, and promptly use the prime/subcontract and government contractual channels. Follow applicable notice and direction requirements. A government request does not automatically modify the subcontract.",[3,4,5,6,7,8,9,11]],["Inspect and accept","Delivering or installing something is distinct from government acceptance against contract requirements.","Readers work locally, but central event reporting, training or documentation may still be incomplete.","Program / security team","Support inspections and acceptance within assigned authority.","Contracting team","Ensure acceptance and related administration follow the contract.","Prime / subcontractor","Demonstrate required performance, correct deficiencies and deliver required records.","Acceptance checklist","TRAINING CHECKLIST: Verify credential behavior; confirm events reach the required monitoring station; test required failure modes; document deficiencies; deliver as-builts and training; obtain acceptance through the designated process. Actual criteria come from the contract.","Why does 'the equipment works' not necessarily establish acceptance?","All doors operate, but event reports are unavailable at the required control center and training is unfinished. What remains before claiming completion?","Compare performance and deliverables to contract acceptance criteria. Resolve reporting deficiencies, provide training and documentation, and obtain acceptance through the designated authority. Physical installation alone is insufficient.",[6,10,12]],["Close out","After physical completion, remaining financial and administrative matters are resolved. The period of performance ending does not itself close the contract.","A project can have no technicians on site while final records, payment or closeout actions remain.","Program / security team","Confirm required outcomes and outstanding technical matters.","Contracting team","Complete applicable administrative and financial closeout actions.","Prime / subcontractor","Resolve remaining deliverables, final billing and applicable property or subcontract records.","Closeout tracker","TRAINING TRACKER: Confirm acceptance; reconcile required deliverables, final invoice and payments; address applicable government property, releases and outstanding matters; document warranty handoff where required. Track responsible person and evidence for each applicable item.","Explain the difference between the end of the period of performance, acceptance and administrative closeout.","Your boss says the period of performance ended Friday, so the contract is closed. Final acceptance and payment are still pending. How would you explain the situation?","The performance window, acceptance and administrative closeout are distinct. Verify completion and acceptance status, then resolve applicable financial and administrative requirements. A calendar date alone is not evidence of closeout.",[9,10,12]]];

function persistAttempt(key,entry){S.practice[key]=entry;save()}
function practicePanel(host,key,prompt,model){
 let saved=S.practice[key]||{};host.innerHTML='<h2>Explain before revealing</h2><p>'+esc(prompt)+'</p><label>Your answer and reasoning<textarea class="response" placeholder="What would you do or explain? What evidence matters? Where are you unsure?"></textarea></label><label>Confidence <select class="confidence"><option>Unsure / guessing</option><option>Partly sure</option><option>Confident</option></select></label><div class="actions practice-actions"></div><div class="feedback-area" aria-live="polite"></div>';
 const area=host.querySelector(".response"),conf=host.querySelector(".confidence"),fb=host.querySelector(".feedback-area");
 area.value=saved.answer||"";conf.value=saved.confidence||"Unsure / guessing";
 const keep=()=>{saved={...saved,answer:area.value,confidence:conf.value};persistAttempt(key,saved)};area.oninput=keep;conf.onchange=keep;
 host.querySelector(".practice-actions").append(b("Save attempt & compare",()=>{
 if(!area.value.trim()){fb.textContent="Try an explanation first—even an uncertain one.";return}
 keep();saved.attempted=Date.now();persistAttempt(key,saved);
 fb.innerHTML='<h3>Worked reasoning</h3><p>'+esc(model)+'</p><p>This is a comparison guide, not an automatic grade. Compare your evidence, conclusion and uncertainty.</p><label>What needs repair?<select class="gap"><option>None identified</option><option>Missing knowledge</option><option>Confused similar concepts</option><option>Misread the document</option><option>Unsupported guess</option></select></label><label>What would you change in your explanation?<textarea class="repair"></textarea></label><label>Evidence from this attempt<select class="level"><option value="0">Needed the explanation or a hint</option><option value="1">Independent explanation, but application needs work</option><option value="2">Independent explanation and application</option></select></label><div class="record"></div><p class="evidence">Self-assessment only. Delayed checks remain separate from reading completion. Bring your answer to our chat for reasoning-specific feedback.</p>';
 fb.querySelector(".record").append(b("Record reflection & schedule review",()=>{
 saved={...saved,gap:fb.querySelector(".gap").value,reflection:fb.querySelector(".repair").value,level:+fb.querySelector(".level").value};
 const days=saved.level===0?1:saved.reviews?7:3;
 saved.due=Date.now()+days*86400000;saved.reviews=(saved.reviews||0)+1;saved.history=[...(saved.history||[]),{date:Date.now(),answer:area.value,confidence:conf.value,level:saved.level,gap:saved.gap,reflection:saved.reflection}];persistAttempt(key,saved);
 fb.querySelector(".record").append(document.createTextNode(" Review scheduled. You can revisit sooner from Review."));
 }));
 },"primary"));
}
function drawLifecycle(){

gov: access-control maintenance sources sought</a><a href="https://sam.gov/opp/e6754c1a97ff49a29506f6f014f72889/view" target="_blank" rel="noopener">SAM.gov: access-control maintenance solicitation listing</a><a href="https://www.gsa.gov/reference/forms/solicitationcontractorder-for-commercial-products-and-commercial-services" target="_blank" rel="noopener">GSA: Standard Form 1449</a></section>';
 STAGES.forEach((s,i)=>{const q=b((i+1)+". "+s[0],()=>{S.stage=i;save();render()},i===k?"active":"");q.setAttribute("aria-current",i===k?"step":"false");V.querySelector(".path").append(q)});

 const prev=b("← Previous stage",()=>{S.stage--;save();render()});prev.disabled=k===0;

 for(let j=3;j<=7;j+=2)V.querySelector(".lanes").innerHTML+='<div class="lane"><strong>'+esc(t[j])+'</strong><div>'+esc(t[j+1])+'</div></div>';
 t[14].forEach(i=>V.querySelector(".related").append(b(L[i][0],()=>open(i))));
 practicePanel(document.getElementById("stage-practice"),"stage-"+k,t[12],t[13]);
}
render=function(){
 S.practice??={};S.stage=Number.isInteger(S.stage)&&S.stage>=0&&S.stage<8?S.stage:0;

 const keys=Object.keys(S.practice);if(!keys.length)document.getElementById("review-list").textContent="Complete an attempt in Lifecycle or a lesson to begin.";
 keys.sort((a,b)=>(S.practice[a].due||0)-(S.practice[b].due||0)).forEach(key=>{const p=S.practice[key],card=document.createElement("article");card.className="card";const isStage=key.startsWith("stage-"),n=+key.split("-")[1];card.innerHTML='<h3>'+esc(isStage?STAGES[n][0]:L[n][0])+'</h3><p>'+esc(p.due?(p.due<=Date.now()?"Due for review":"Review "+new Date(p.due).toLocaleDateString()):"Attempt saved; reflection not recorded")+'</p><p>Attempts recorded: '+(p.history||[]).length+' · '+esc(p.confidence||"")+'</p><p>'+esc(p.gap||"")+'</p>';card.append(b("Revisit",()=>{if(isStage){S.stage=n;save();nav("lifecycle")}else open(n)}));document.getElementById("review-list").append(card)});return;
 }
 priorRender();
 if(page==="home"){const card=document.createElement("section");card.className="card";card.innerHTML='<h2>Learn the lifecycle, then use it</h2><p>Orient → learn from an example → explain from memory → apply → compare reasoning → repair → revisit.</p><p>Existing completion and notes are preserved. New evidence tracks attempts, confidence, reflections and later reviews separately.</p>';card.append(b("Open the visual lifecycle",()=>nav("lifecycle"),"primary"));V.prepend(card)}
 if(page==="detail"){

 matches.forEach(k=>intro.querySelector(".actions").append(b(STAGES[k][0],()=>{S.stage=k;save();nav("lifecycle")})));V.children[1].after(intro);

 practicePanel(check,"lesson-"+id,L[id][3]+" Explain your next action, evidence and uncertainty.",L[id][5][L[id][6]]+". "+L[id][2]);
